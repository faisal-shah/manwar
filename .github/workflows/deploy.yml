name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BUILD_ID: ${{ github.sha }}
      - run: npm ci --prefix functions
      - run: npm test --prefix functions
      # The Functions emulator runs the built code (phone pairing in the e2e specs).
      - run: npm run build --prefix functions
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npx playwright install --with-deps chromium
      # Demo mode runs against the Auth, Firestore and Functions emulators.
      - run: npx --yes firebase-tools@15 emulators:exec --only auth,firestore,functions --project demo-manwar "npx playwright test"

      # Keyless auth: GitHub's OIDC token is exchanged for the deployer
      # service account via Workload Identity Federation (the provider only
      # accepts tokens from this repository). Both come from repository
      # variables, so the workflow names no project; the project itself is
      # the default in .firebaserc.
      - if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      # --force lets a non-interactive deploy set the Artifact Registry
      # cleanup policy for function images (and delete removed functions).
      - if: github.event_name != 'pull_request'
        run: npx --yes firebase-tools@15 deploy --only hosting,firestore,functions --non-interactive --force
